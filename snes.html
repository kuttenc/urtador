<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogos SNES — Archive.org</title><link rel="stylesheet" href="assets/styles.css"><style>
main{max-width:1100px;margin:auto;padding:28px 18px 60px}.box{background:#101b2b;border:1px solid #21445d;border-radius:14px;padding:20px}.toolbar{display:flex;gap:10px;margin:18px 0}.toolbar input{flex:1;padding:12px;border-radius:8px;border:1px solid #31536c;background:#0b1726;color:#fff}.status,.note{color:#b8c8d7;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{background:#0b1726;border:1px solid #31536c;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px}.cover{width:30px;height:30px;object-fit:cover;border-radius:5px}.title{font-weight:700;min-height:2.5em}.meta{font-size:.85rem;color:#b8c8d7}.button{display:block;text-align:center;padding:10px;border-radius:8px;background:#0aa875;color:#fff;text-decoration:none;font-weight:700}
</style></head><body><header class="site-header"><a href="index.html">Urtador</a></header><main><section class="box"><h1>Jogos SNES</h1><p class="note">Catálogo da coleção pública do Archive.org. Escolha um título para abrir a fonte oficial. O site não armazena os jogos nem controla o cache do Chrome.</p><div class="toolbar"><input id="q" type="search" placeholder="Pesquisar título..."></div><p id="status" class="status">Carregando a lista...</p><section id="grid" class="grid"></section></section></main><script>
const item='gameplay-snes',img='https://archive.org/services/img/'+item,q=document.querySelector('#q'),grid=document.querySelector('#grid'),status=document.querySelector('#status');let games=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const size=n=>{const x=Number(n||0);return x?`${(x/1048576).toFixed(1)} MB`:''};function rememberByTitle(encoded){localStorage.setItem('urtador:lastGame',JSON.stringify({title:decodeURIComponent(encoded),system:'snes',at:Date.now()}))}function render(){const term=q.value.trim().toLowerCase(),list=games.filter(g=>g.title.toLowerCase().includes(term));status.textContent=`${list.length} de ${games.length} títulos`;grid.innerHTML=list.map(g=>{const u=`https://archive.org/details/${item}?file=${encodeURIComponent(g.name)}`,t=encodeURIComponent(g.title);return `<article class="card"><img class="cover" src="${img}" alt="Capa da coleção"><div class="title">${esc(g.title)}</div><div class="meta">${size(g.size)} · SNES</div><a class="button" href="${u}" target="_blank" rel="noopener">Abrir e baixar no Archive.org</a><a class="note" href="emulador.html?system=snes&game=${t}" onclick="rememberByTitle('${t}')">Jogar depois no emulador</a></article>`}).join('')}q.addEventListener('input',render);fetch(`https://archive.org/metadata/${item}`).then(r=>r.json()).then(d=>{games=(d.files||[]).filter(f=>/\.7z$|\.zip$|\.sfc$|\.smc$/i.test(f.name||'')).map(f=>({name:f.name,title:(f.name||'').split('/').pop(),size:f.size})).sort((a,b)=>a.title.localeCompare(b.title));render()}).catch(()=>status.textContent='Não foi possível carregar a lista agora.');
</script></body></html>
