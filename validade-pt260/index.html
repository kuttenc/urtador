<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#050505">
    <meta name="robots" content="noindex,nofollow">
    <title>Validade PT260 · Grupo</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topline"><span class="dot"></span><span id="eyebrow">VALIDADE PT260 · GRUPO</span><span id="state">CONECTANDO</span></header>
      <section class="hero">
        <p class="kicker" id="kicker">PAINEL ONLINE</p>
        <h1 id="title">Sua sessão<br>de coleta.</h1>
        <p id="lead">Abra pelo aplicativo para sincronizar este painel com a sessão do dispositivo.</p>
      </section>
      <section class="grid" aria-label="Estado da sessão">
        <article><span id="card-one-label">Sessão</span><strong id="session-value">—</strong></article>
        <article><span id="card-two-label">Idioma</span><strong id="language-value">—</strong></article>
      </section>
      <section class="panel">
        <p class="kicker" id="panel-kicker">COLETA</p>
        <h2 id="panel-title">Próximo passo</h2>
        <p id="panel-copy">No aplicativo, informe origem, destino e quantidade. Tire a foto para enviar ao grupo operacional.</p>
        <button id="refresh" type="button">ATUALIZAR PAINEL</button>
      </section>
      <p id="notice" class="notice" aria-live="polite"></p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
